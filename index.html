<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>রেস্টুরেন্ট মেনু</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* লাইট মোড ভ্যারিয়েবল */
    :root,
    [data-theme="light"] {
      --bg-page: #f1f5f9;
      --bg-pattern: radial-gradient(circle at 20% 0%, rgba(234, 88, 12, 0.09), transparent 45%),
                    radial-gradient(circle at 80% 10%, rgba(14, 165, 233, 0.08), transparent 40%);
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --glass: rgba(255, 255, 255, 0.85);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #ea580c;
      --accent-soft: rgba(234, 88, 12, 0.1);
      --btn-dark-bg: linear-gradient(135deg, #0f172a, #1e293b);
      --btn-dark-text: #ffffff;
      --card-shadow: 0 18px 40px -12px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.05);
      --dock-bg: rgba(255, 255, 255, 0.9);
      --dock-border: rgba(226, 232, 240, 0.9);
      --shimmer-1: #e2e8f0;
      --shimmer-2: #f8fafc;
    }

    /* ডার্ক / নাইট মোড ভ্যারিয়েবল */
    [data-theme="dark"] {
      --bg-page: #070b14;
      --bg-pattern: radial-gradient(circle at 20% 0%, rgba(245, 158, 11, 0.12), transparent 45%),
                    radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.08), transparent 40%);
      --surface: #111827;
      --surface-soft: #1a2333;
      --glass: rgba(17, 24, 39, 0.84);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.14);
      --btn-dark-bg: linear-gradient(135deg, #f59e0b, #d97706);
      --btn-dark-text: #0f172a;
      --card-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.05);
      --dock-bg: rgba(17, 24, 39, 0.88);
      --dock-border: rgba(51, 65, 85, 0.7);
      --shimmer-1: #1e293b;
      --shimmer-2: #283548;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-page);
      background-image: var(--bg-pattern);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 12px 12px 104px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* ফ্লোটিং ক্যাপসুল হেডার */
    .header-wrap {
      position: sticky;
      top: 10px;
      z-index: 50;
      max-width: 780px;
      margin: 0 auto 16px;
    }

    .top-bar {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 12px 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 10px 28px -10px rgba(0, 0, 0, 0.12);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.25);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-info {
      min-width: 0;
    }

    .brand-name {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.22);
    }

    /* ডার্ক / নাইট মোড টগল বাটন */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, background 0.3s ease, border-color 0.3s ease;
    }

    .theme-toggle:active {
      transform: scale(0.95);
    }

    /* মেনু মেইন সেকশন */
    .menu-wrapper {
      max-width: 780px;
      margin: 0 auto;
    }

    .menu-pages {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ইউনিফাইড মেনু শোকেস কার্ড */
    .menu-card {
      background: var(--surface);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .menu-card-media {
      position: relative;
      background: var(--surface-soft);
    }

    .menu-card-media img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      cursor: zoom-in;
    }

    .menu-card-media iframe {
      display: block;
      width: 100%;
      height: 72vh;
      min-height: 450px;
      border: none;
      background: #fff;
    }

    .page-pill {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      pointer-events: none;
    }

    /* কার্ডের সাথে যুক্ত অ্যাকশন বার (জুম + ডাউনলোড) */
    .card-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .btn-zoom-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-zoom-inline:active { transform: scale(0.96); }

    .btn-download {
      flex: 1;
      max-width: 240px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 13px;
      border: none;
      background: var(--btn-dark-bg);
      color: var(--btn-dark-text);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-download:active { transform: scale(0.97); }

    /* শিমার লোডার */
    .skeleton-card {
      height: 440px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: linear-gradient(90deg, var(--shimmer-1) 25%, var(--shimmer-2) 50%, var(--shimmer-1) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-weight: 600;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .menu-error {
      padding: 36px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .menu-error a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
    }

    /* নিচের ফ্লোটিং ডক (কল ও WhatsApp) */
    .bottom-dock-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 60;
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      display: flex;
      justify-content: center;
    }

    .bottom-actions {
      pointer-events: auto;
      width: 100%;
      max-width: 520px;
      background: var(--dock-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--dock-border);
      border-radius: 24px;
      padding: 7px;
      display: flex;
      gap: 8px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .action-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 17px;
      color: #ffffff;
      font-size: 0.96rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease;
    }

    .action-btn:active { transform: scale(0.96); }

    .btn-call {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      box-shadow: 0 6px 16px -4px rgba(2, 132, 199, 0.45);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #22c55e, #15803d);
      box-shadow: 0 6px 16px -4px rgba(22, 163, 74, 0.45);
    }

    /* ফুলস্ক্রিন জুম মডাল */
    .zoom-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(5, 8, 16, 0.95);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .zoom-overlay.active { display: flex; }

    .zoom-close {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 160;
    }

    .zoom-scroll {
      width: 100%;
      max-height: 88vh;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      border-radius: 12px;
    }

    .zoom-scroll img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .zoom-tip {
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.8rem;
    }

    /* অ্যাডমিন মডাল (ডার্ক/লাইট অ্যাডাপ্টিভ) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 8, 16, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow-y: auto;
    }

    .modal-overlay.active { display: flex; }

    .admin-card {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 500px;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
      max-height: 92vh;
      overflow-y: auto;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .admin-header h2 { font-size: 1.15rem; font-weight: 700; }

    .close-btn {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-main);
    }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-main);
    }

    .form-group small {
      display: block;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-top: 4px;
      line-height: 1.4;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface-soft);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 11px;
      font-size: 0.94rem;
      font-family: inherit;
      outline: none;
    }

    .form-control:focus { border-color: var(--accent); }
    textarea.form-control { min-height: 84px; resize: vertical; }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-save { background: var(--btn-dark-bg); color: var(--btn-dark-text); }
    .btn-secondary {
      background: var(--surface-soft);
      color: var(--text-main);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }

    .toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-main);
      color: var(--surface);
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 0.86rem;
      font-weight: 600;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: none;
    }
  </style>
</head>
<body>

  <!-- ফ্লোটিং ক্যাপসুল হেডার + ডার্ক/নাইট মোড বাটন -->
  <div class="header-wrap">
    <header class="top-bar">
      <div class="brand-left">
        <span class="brand-logo" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
        </span>
        <div class="brand-info">
          <div class="brand-name" id="displayRestaurantName">ডিজিটাল মেনু</div>
          <div class="brand-status"><span class="live-dot"></span> ডিজিটাল মেনু কার্ড</div>
        </div>
      </div>

      <button type="button" class="theme-toggle" id="themeToggleBtn" aria-label="ডার্ক বা লাইট মোড পরিবর্তন">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">নাইট</span>
      </button>
    </header>
  </div>

  <!-- ইউজার মেনু প্যানেল -->
  <main class="menu-wrapper">
    <div class="menu-pages" id="menuContainer">
      <div class="skeleton-card">মেনু লোড হচ্ছে...</div>
    </div>
  </main>

  <!-- নিচের ফ্লোটিং গ্লাস ডক -->
  <div class="bottom-dock-wrap">
    <footer class="bottom-actions">
      <a href="tel:+919876543210" class="action-btn btn-call" id="callBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span>কল করুন</span>
      </a>
      <a href="https://wa.me/919876543210" target="_blank" rel="noopener" class="action-btn btn-whatsapp" id="whatsappBtn">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.03 2C6.5 2 2 6.48 2 12c0 1.97.57 3.81 1.56 5.36L2 22l4.78-1.52A9.95 9.95 0 0 0 12.03 22C17.55 22 22 17.52 22 12S17.55 2 12.03 2zm5.82 14.12c-.25.7-1.44 1.34-2 1.42-.52.08-1.18.11-1.91-.12-.45-.14-1.03-.33-1.76-.65-3.08-1.33-5.09-4.43-5.24-4.63-.15-.21-1.25-1.66-1.25-3.17s.79-2.25 1.07-2.55c.28-.3.61-.38.82-.38.2 0 .41 0 .59.01.19.01.44-.07.69.53.26.62.87 2.13.95 2.28.08.15.13.33.03.54-.1.2-.15.33-.31.51-.15.18-.32.4-.46.54-.15.15-.31.32-.13.62.18.3.79 1.3 1.7 2.1 1.17 1.04 2.15 1.37 2.46 1.52.3.15.48.13.66-.08.18-.2.76-.88.96-1.18.2-.3.41-.25.68-.15.28.1 1.76.83 2.06.98.3.15.51.23.58.36.08.13.08.75-.17 1.45z"/>
        </svg>
        <span>WhatsApp</span>
      </a>
    </footer>
  </div>

  <!-- ফুলস্ক্রিন জুম মডাল -->
  <div class="zoom-overlay" id="zoomModal">
    <button class="zoom-close" id="closeZoomBtn" aria-label="বন্ধ করুন">&times;</button>
    <div class="zoom-scroll">
      <img id="zoomImg" src="" alt="মেনু বড় ভিউ" />
    </div>
    <div class="zoom-tip">ভালোভাবে দেখতে দুই আঙুল দিয়ে জুম করুন</div>
  </div>

  <!-- গোপন অ্যাডমিন মডাল -->
  <div class="modal-overlay" id="adminModal">
    <div class="admin-card">
      <div class="admin-header">
        <h2>⚙️ অ্যাডমিন প্যানেল</h2>
        <button class="close-btn" id="closeAdminBtn" aria-label="বন্ধ করুন">&times;</button>
      </div>

      <div id="loginSection">
        <div class="form-group">
          <label for="adminPassInput">অ্যাডমিন পাসওয়ার্ড দিন</label>
          <input type="password" id="adminPassInput" class="form-control" placeholder="আপনার গোপন পাসওয়ার্ড..." />
          <div class="error-msg" id="loginError"></div>
        </div>
        <button type="button" class="btn btn-save" id="loginBtn">লগইন করুন</button>
      </div>

      <form id="adminForm" style="display: none;">
        <div class="form-group">
          <label for="inputName">রেস্টুরেন্টের নাম</label>
          <input type="text" id="inputName" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="inputMenuLinks">মেনু লিঙ্ক (Link Format)</label>
          <textarea id="inputMenuLinks" class="form-control" placeholder="ছবি, PDF বা Google Drive লিঙ্ক দিন..."></textarea>
          <small>একাধিক পেজ হলে প্রতিটি লিঙ্ক নতুন লাইনে দিন।</small>
        </div>

        <div class="form-group">
          <label for="inputDownloadLink">আলাদা ডাউনলোড লিঙ্ক (ঐচ্ছিক)</label>
          <input type="url" id="inputDownloadLink" class="form-control" placeholder="খালি রাখলে মেনু লিঙ্ক থেকেই ডাউনলোড হবে" />
        </div>

        <div class="form-group">
          <label for="inputPhone">কল নম্বর</label>
          <input type="tel" id="inputPhone" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="inputWhatsapp">WhatsApp নম্বর</label>
          <input type="tel" id="inputWhatsapp" class="form-control" placeholder="919876543210" required />
        </div>

        <button type="submit" class="btn btn-save" id="saveBtn">✅ লাইভ সেভ করুন</button>
        <button type="button" class="btn btn-secondary" id="logoutBtn">লগআউট করুন</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toastMsg"></div>

  <script>
    (function () {
      // আপনার Google Apps Script URL যুক্ত করা হয়েছে
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCInMJoqXu6I5uIIki4mKrD4MInvBmM3km85MtXOUZw56gMCVjy3o8etswFzHae6G15Q/exec";

      const CACHE_KEY = "restaurant_menu_cache_v4";
      const THEME_KEY = "restaurant_theme_mode_v1";

      let sessionKey = "";
      let sessionPassword = "";
      let currentConfig = {
        restaurantName: "আমার রেস্টুরেন্ট",
        menuLinks: "",
        downloadLink: "",
        phone: "+919876543210",
        whatsapp: "919876543210"
      };

      const displayRestaurantName = document.getElementById("displayRestaurantName");
      const menuContainer = document.getElementById("menuContainer");
      const callBtn = document.getElementById("callBtn");
      const whatsappBtn = document.getElementById("whatsappBtn");

      const themeToggleBtn = document.getElementById("themeToggleBtn");
      const themeIcon = document.getElementById("themeIcon");
      const themeLabel = document.getElementById("themeLabel");

      const zoomModal = document.getElementById("zoomModal");
      const zoomImg = document.getElementById("zoomImg");
      const closeZoomBtn = document.getElementById("closeZoomBtn");

      const adminModal = document.getElementById("adminModal");
      const closeAdminBtn = document.getElementById("closeAdminBtn");
      const loginSection = document.getElementById("loginSection");
      const adminPassInput = document.getElementById("adminPassInput");
      const loginError = document.getElementById("loginError");
      const loginBtn = document.getElementById("loginBtn");
      const adminForm = document.getElementById("adminForm");
      const saveBtn = document.getElementById("saveBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const toastMsg = document.getElementById("toastMsg");

      const inputName = document.getElementById("inputName");
      const inputMenuLinks = document.getElementById("inputMenuLinks");
      const inputDownloadLink = document.getElementById("inputDownloadLink");
      const inputPhone = document.getElementById("inputPhone");
      const inputWhatsapp = document.getElementById("inputWhatsapp");

      // ডার্ক / লাইট মোড সেটআপ
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
          themeIcon.textContent = "☀️";
          themeLabel.textContent = "লাইট";
        } else {
          themeIcon.textContent = "🌙";
          themeLabel.textContent = "নাইট";
        }
      }

      function initTheme() {
        let saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
        if (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          saved = "dark";
        }
        applyTheme(saved === "dark" ? "dark" : "light");
      }

      themeToggleBtn.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      });

      initTheme();

      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.style.display = "block";
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => { toastMsg.style.display = "none"; }, 2800);
      }

      function getDemoSvgDataUri(name) {
        const safeName = (name || "আমার রেস্টুরেন্ট").replace(/[<>&"']/g, "");
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
          <rect width="800" height="900" fill="#fffdf8"/>
          <rect x="24" y="24" width="752" height="852" rx="18" fill="none" stroke="#d97706" stroke-width="4"/>
          <text x="400" y="110" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#0f172a">${safeName}</text>
          <text x="400" y="155" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#b45309">RESTAURANT MENU</text>
          <line x1="180" y1="185" x2="620" y2="185" stroke="#d97706" stroke-width="2"/>
          <text x="70" y="260" font-family="sans-serif" font-size="22" fill="#1e293b">১. স্পেশাল ভেজ থালি</text>
          <text x="730" y="260" text-anchor="end" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1e293b">₹ ২২০</text>
          <text x="70" y="315" font-family="sans-serif" font-size="22" fill="#1e293b">২. খিচুড়ি ও কম্বো মিল</text>
          <text x="730" y="315" text-anchor="end" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1e293b">₹ ১৮০</text>
        </svg>`;
        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      }

      function getGoogleDriveId(url) {
        const m1 = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (m1) return m1[1];
        const m2 = url.match(/drive\.google\.com\/.*[?&]id=([a-zA-Z0-9_-]+)/);
        return m2 ? m2[1] : null;
      }

      function isPdfUrl(url) {
        return /\.pdf(\?.*)?$/i.test(url);
      }

      function formatPhoneForTel(phone) {
        return (phone || "").replace(/[^\d+]/g, "");
      }

      function formatWhatsappNumber(num) {
        let digits = (num || "").replace(/\D/g, "");
        if (digits.length === 10) digits = "91" + digits;
        return digits;
      }

      function openZoomView(src) {
        zoomImg.src = src;
        zoomModal.classList.add("active");
      }

      closeZoomBtn.addEventListener("click", () => zoomModal.classList.remove("active"));
      zoomModal.addEventListener("click", (e) => {
        if (e.target === zoomModal) zoomModal.classList.remove("active");
      });

      async function handleDownload(targetLink) {
        const rawLinks = (currentConfig.menuLinks || "").split(/\n|,/).map(s => s.trim()).filter(Boolean);
        const target = (currentConfig.downloadLink || "").trim() || targetLink || rawLinks[0] || "";

        if (!target) {
          const a = document.createElement("a");
          a.href = getDemoSvgDataUri(currentConfig.restaurantName);
          a.download = "restaurant-menu.svg";
          document.body.appendChild(a);
          a.click();
          a.remove();
          return;
        }

        const driveId = getGoogleDriveId(target);
        if (driveId) {
          window.open(`https://drive.google.com/uc?export=download&id=${driveId}`, "_blank", "noopener");
          return;
        }

        try {
          showToast("ডাউনলোড শুরু হচ্ছে...");
          const res = await fetch(target, { mode: "cors" });
          if (!res.ok) throw new Error("Fetch failed");
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = isPdfUrl(target) ? "menu.pdf" : "menu.jpg";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        } catch (e) {
          window.open(target, "_blank", "noopener");
        }
      }

      function createActionBar(zoomSrc, downloadTarget) {
        const bar = document.createElement("div");
        bar.className = "card-action-bar";

        const zoomBtn = document.createElement("button");
        zoomBtn.type = "button";
        zoomBtn.className = "btn-zoom-inline";
        zoomBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg> জুম করুন`;
        if (zoomSrc) {
          zoomBtn.addEventListener("click", () => openZoomView(zoomSrc));
        } else {
          zoomBtn.style.display = "none";
        }

        const dlBtn = document.createElement("button");
        dlBtn.type = "button";
        dlBtn.className = "btn-download";
        dlBtn.innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> মেনু ডাউনলোড`;
        dlBtn.addEventListener("click", () => handleDownload(downloadTarget));

        bar.appendChild(zoomBtn);
        bar.appendChild(dlBtn);
        return bar;
      }

      function renderUserPanel() {
        document.title = (currentConfig.restaurantName || "রেস্টুরেন্ট") + " - মেনু";
        displayRestaurantName.textContent = currentConfig.restaurantName || "আমার রেস্টুরেন্ট";

        const telClean = formatPhoneForTel(currentConfig.phone);
        callBtn.href = telClean ? `tel:${telClean}` : "#";

        const waClean = formatWhatsappNumber(currentConfig.whatsapp);
        whatsappBtn.href = waClean ? `https://wa.me/${waClean}` : "#";

        menuContainer.innerHTML = "";
        const rawLinks = (currentConfig.menuLinks || "")
          .split(/\n|,/)
          .map(s => s.trim())
          .filter(Boolean);

        if (rawLinks.length === 0) {
          const card = document.createElement("div");
          card.className = "menu-card";
          const media = document.createElement("div");
          media.className = "menu-card-media";
          const demoSrc = getDemoSvgDataUri(currentConfig.restaurantName);
          const img = document.createElement("img");
          img.src = demoSrc;
          img.alt = "রেস্টুরেন্ট মেনু";
          img.addEventListener("click", () => openZoomView(demoSrc));
          media.appendChild(img);
          card.appendChild(media);
          card.appendChild(createActionBar(demoSrc, ""));
          menuContainer.appendChild(card);
          return;
        }

        rawLinks.forEach((link, idx) => {
          const card = document.createElement("div");
          card.className = "menu-card";

          const media = document.createElement("div");
          media.className = "menu-card-media";

          if (rawLinks.length > 1) {
            const pill = document.createElement("span");
            pill.className = "page-pill";
            pill.textContent = `পাতা ${idx + 1} / ${rawLinks.length}`;
            media.appendChild(pill);
          }

          const driveId = getGoogleDriveId(link);

          if (driveId) {
            const driveThumbUrl = `https://drive.google.com/thumbnail?id=${driveId}&sz=w1600`;
            const img = document.createElement("img");
            img.src = driveThumbUrl;
            img.alt = `মেনু পেজ ${idx + 1}`;
            img.loading = "lazy";
            img.addEventListener("click", () => openZoomView(driveThumbUrl));
            img.onerror = function () {
              media.innerHTML = "";
              const iframe = document.createElement("iframe");
              iframe.src = `https://drive.google.com/file/d/${driveId}/preview`;
              iframe.title = `মেনু পেজ ${idx + 1}`;
              media.appendChild(iframe);
            };
            media.appendChild(img);
            card.appendChild(media);
            card.appendChild(createActionBar(driveThumbUrl, link));
          } else if (isPdfUrl(link)) {
            const iframe = document.createElement("iframe");
            iframe.src = `https://docs.google.com/gview?embedded=true&url=${encodeURIComponent(link)}`;
            iframe.title = `মেনু PDF ${idx + 1}`;
            media.appendChild(iframe);
            card.appendChild(media);
            card.appendChild(createActionBar(null, link));
          } else {
            const img = document.createElement("img");
            img.src = link;
            img.alt = `মেনু পেজ ${idx + 1}`;
            img.loading = "lazy";
            img.addEventListener("click", () => openZoomView(link));
            img.onerror = function () {
              media.innerHTML = `<div class="menu-error">মেনু লোড করা যায়নি।<br><a href="${link}" target="_blank" rel="noopener">মেনু ওপেন করুন</a></div>`;
            };
            media.appendChild(img);
            card.appendChild(media);
            card.appendChild(createActionBar(link, link));
          }

          menuContainer.appendChild(card);
        });
      }

      async function loadMenuFromServer() {
        let hasCache = false;
        try {
          const cached = localStorage.getItem(CACHE_KEY);
          if (cached) {
            currentConfig = { ...currentConfig, ...JSON.parse(cached) };
            renderUserPanel();
            hasCache = true;
          }
        } catch (e) {}

        try {
          const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
          const json = await res.json();
          if (json.ok && json.data) {
            currentConfig = { ...currentConfig, ...json.data };
            localStorage.setItem(CACHE_KEY, JSON.stringify(currentConfig));
            renderUserPanel();
          }
        } catch (err) {
          if (!hasCache) renderUserPanel();
        }
      }

      async function checkSecretAdminAccess() {
        const urlKey = new URLSearchParams(window.location.search).get("access");
        if (!urlKey) return;

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "check_key", key: urlKey })
          });
          const json = await res.json();

          if (json.ok) {
            sessionKey = urlKey;
            loginSection.style.display = "block";
            adminForm.style.display = "none";
            adminModal.classList.add("active");
            setTimeout(() => adminPassInput.focus(), 100);
          }
        } catch (e) {}
      }

      function fillForm() {
        inputName.value = currentConfig.restaurantName || "";
        inputMenuLinks.value = currentConfig.menuLinks || "";
        inputDownloadLink.value = currentConfig.downloadLink || "";
        inputPhone.value = currentConfig.phone || "";
        inputWhatsapp.value = currentConfig.whatsapp || "";
      }

      closeAdminBtn.addEventListener("click", () => adminModal.classList.remove("active"));
      adminModal.addEventListener("click", (e) => {
        if (e.target === adminModal) adminModal.classList.remove("active");
      });

      async function verifyLogin() {
        const pwd = adminPassInput.value;
        if (!pwd) return;

        loginBtn.disabled = true;
        loginBtn.textContent = "যাচাই করা হচ্ছে...";
        loginError.style.display = "none";

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "verify", key: sessionKey, password: pwd })
          });
          const json = await res.json();
          if (json.ok) {
            sessionPassword = pwd;
            loginSection.style.display = "none";
            adminForm.style.display = "block";
            fillForm();
          } else {
            loginError.textContent = json.error || "ভুল পাসওয়ার্ড!";
            loginError.style.display = "block";
          }
        } catch (err) {
          loginError.textContent = "সার্ভারের সাথে সংযোগ করা যায়নি!";
          loginError.style.display = "block";
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "লগইন করুন";
        }
      }

      loginBtn.addEventListener("click", verifyLogin);
      adminPassInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); verifyLogin(); }
      });

      adminForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        saveBtn.disabled = true;
        saveBtn.textContent = "সেভ হচ্ছে...";

        const payload = {
          action: "save",
          key: sessionKey,
          password: sessionPassword,
          restaurantName: inputName.value.trim(),
          menuLinks: inputMenuLinks.value.trim(),
          downloadLink: inputDownloadLink.value.trim(),
          phone: inputPhone.value.trim(),
          whatsapp: inputWhatsapp.value.trim()
        };

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.ok && json.data) {
            currentConfig = json.data;
            localStorage.setItem(CACHE_KEY, JSON.stringify(currentConfig));
            renderUserPanel();
            adminModal.classList.remove("active");
            showToast("সফলভাবে লাইভ আপডেট হয়েছে!");
          } else {
            alert(json.error || "সেভ করা যায়নি!");
          }
        } catch (err) {
          alert("নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।");
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "✅ লাইভ সেভ করুন";
        }
      });

      logoutBtn.addEventListener("click", () => {
        sessionPassword = "";
        adminModal.classList.remove("active");
        showToast("লগআউট হয়েছে।");
      });

      loadMenuFromServer();
      checkSecretAdminAccess();
    })();
  </script>
</body>
</html>
