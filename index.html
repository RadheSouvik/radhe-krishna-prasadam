<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>রেস্টুরেন্ট মেনু</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* লাইট মোড (ডে) */
    :root,
    [data-theme="light"] {
      --bg-page: #f6f3ec;
      --aurora-1: rgba(234, 88, 12, 0.14);
      --aurora-2: rgba(29, 78, 216, 0.10);
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --glass: rgba(255, 255, 255, 0.82);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: rgba(15, 23, 42, 0.09);
      --accent: #d97706;
      --accent-2: #ea580c;
      --accent-soft: rgba(217, 119, 6, 0.12);
      --frame-glow: linear-gradient(135deg, rgba(217, 119, 6, 0.45), rgba(29, 78, 216, 0.25), rgba(234, 88, 12, 0.45));
      --btn-primary: linear-gradient(135deg, #0f172a, #1e293b);
      --btn-primary-text: #ffffff;
      --card-shadow: 0 24px 48px -14px rgba(15, 23, 42, 0.16);
      --dock-bg: rgba(255, 255, 255, 0.88);
      --dock-border: rgba(255, 255, 255, 0.95);
      --shimmer-1: #eae5db;
      --shimmer-2: #faf7f0;
    }

    /* ডার্ক মোড (নাইট) */
    [data-theme="dark"] {
      --bg-page: #060913;
      --aurora-1: rgba(245, 158, 11, 0.16);
      --aurora-2: rgba(56, 189, 248, 0.12);
      --surface: #111827;
      --surface-2: #1a2234;
      --glass: rgba(15, 23, 42, 0.80);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.09);
      --accent: #fbbf24;
      --accent-2: #f59e0b;
      --accent-soft: rgba(251, 191, 36, 0.14);
      --frame-glow: linear-gradient(135deg, rgba(251, 191, 36, 0.48), rgba(56, 189, 248, 0.28), rgba(245, 158, 11, 0.48));
      --btn-primary: linear-gradient(135deg, #fbbf24, #d97706);
      --btn-primary-text: #090d16;
      --card-shadow: 0 26px 60px -12px rgba(0, 0, 0, 0.78);
      --dock-bg: rgba(15, 23, 42, 0.86);
      --dock-border: rgba(255, 255, 255, 0.1);
      --shimmer-1: #1a2234;
      --shimmer-2: #243047;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      padding: 14px 12px 110px;
      overflow-x: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    /* অ্যানিমেটেড অরোরা ব্যাকগ্রাউন্ড */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      animation: floatBlob 14s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 340px;
      height: 340px;
      top: -90px;
      left: -60px;
      background: var(--aurora-1);
    }

    .blob-2 {
      width: 320px;
      height: 320px;
      top: 120px;
      right: -80px;
      background: var(--aurora-2);
      animation-delay: -5s;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, 35px) scale(1.12); }
    }

    /* উপরে স্ক্রল প্রগ্রেস লাইন */
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), #3b82f6);
      z-index: 90;
      transition: width 0.08s linear;
    }

    /* ফ্লোটিং গ্লাস হেডার */
    .header-wrap {
      position: sticky;
      top: 10px;
      z-index: 50;
      max-width: 780px;
      margin: 0 auto 18px;
    }

    .top-bar {
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 9px 10px 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.15);
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 6px 16px -4px rgba(217, 119, 6, 0.45);
    }

    .brand-info { min-width: 0; }

    .brand-name {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.22;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulseRing 2s infinite;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
      70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .icon-pill-btn {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.3s ease;
    }

    .icon-pill-btn:active { transform: scale(0.92); }

    /* স্লাইডিং ডে/নাইট পিল সুইচ */
    .theme-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 11px 0 8px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.3s ease;
    }

    .theme-switch:active { transform: scale(0.94); }

    .switch-orb {
      width: 24px;
      height: 24px;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    /* মেনু শোকেস কনটেইনার */
    .menu-wrapper {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
    }

    .menu-pages {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* প্রিমিয়াম গ্লো ফ্রেম */
    .menu-frame {
      padding: 1.5px;
      border-radius: 26px;
      background: var(--frame-glow);
      box-shadow: var(--card-shadow);
      animation: cardIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-card {
      background: var(--surface);
      border-radius: 24.5px;
      overflow: hidden;
      transition: background 0.35s ease;
    }

    .menu-card-media {
      position: relative;
      background: var(--surface-2);
    }

    .menu-card-media img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      cursor: zoom-in;
    }

    .menu-card-media iframe {
      display: block;
      width: 100%;
      height: 73vh;
      min-height: 450px;
      border: none;
      background: #fff;
    }

    .page-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(9, 13, 22, 0.76);
      backdrop-filter: blur(8px);
      color: #fde68a;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 99px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      pointer-events: none;
    }

    /* কার্ড ফুটার অ্যাকশন বার */
    .card-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .btn-zoom-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-zoom-inline:active { transform: scale(0.95); }

    .btn-download {
      flex: 1;
      max-width: 245px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 14px;
      border: none;
      background: var(--btn-primary);
      color: var(--btn-primary-text);
      font-family: inherit;
      font-size: 0.93rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease;
    }

    .btn-download:active { transform: scale(0.96); }

    /* শিমার লোডার */
    .skeleton-card {
      height: 450px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: linear-gradient(90deg, var(--shimmer-1) 25%, var(--shimmer-2) 50%, var(--shimmer-1) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite linear;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
      font-weight: 600;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .menu-error {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .menu-error a {
      display: inline-block;
      margin-top: 10px;
      padding: 9px 18px;
      background: var(--accent);
      color: #fff;
      border-radius: 11px;
      font-weight: 600;
      text-decoration: none;
    }

    /* উপরে ওঠার ফ্লোটিং বাটন */
    .scroll-top-btn {
      position: fixed;
      right: 14px;
      bottom: 88px;
      z-index: 55;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .scroll-top-btn.visible { display: flex; }

    /* নিচের ফ্লোটিং গ্লাস ডক (কল ও WhatsApp) */
    .bottom-dock-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 60;
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      display: flex;
      justify-content: center;
    }

    .bottom-actions {
      pointer-events: auto;
      width: 100%;
      max-width: 540px;
      background: var(--dock-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--dock-border);
      border-radius: 26px;
      padding: 7px;
      display: flex;
      gap: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .action-btn {
      position: relative;
      overflow: hidden;
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 14px;
      border-radius: 19px;
      color: #ffffff;
      font-size: 0.97rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease;
    }

    .action-btn:active { transform: scale(0.96); }

    .btn-call {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      box-shadow: 0 8px 20px -5px rgba(2, 132, 199, 0.5);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #22c55e, #15803d);
      box-shadow: 0 8px 20px -5px rgba(22, 163, 74, 0.5);
    }

    /* WhatsApp বাটনে শাইন অ্যানিমেশন */
    .btn-whatsapp::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      transform: skewX(-20deg);
      animation: shineSweep 4s infinite;
    }

    @keyframes shineSweep {
      0%, 60% { left: -120%; }
      100% { left: 160%; }
    }

    /* অ্যাডভান্সড ইন্টারঅ্যাক্টিভ জুম মডাল */
    .zoom-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(5, 8, 16, 0.96);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
    }

    .zoom-overlay.active { display: flex; }

    .zoom-topbar {
      width: 100%;
      max-width: 780px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      padding: 4px 2px 8px;
    }

    .zoom-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
    }

    .zoom-close {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-scroll {
      flex: 1;
      width: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      border-radius: 14px;
    }

    .zoom-scroll img {
      width: 100%;
      max-width: 760px;
      height: auto;
      border-radius: 10px;
      transition: width 0.2s ease;
    }

    .zoom-controls {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px;
      border-radius: 99px;
      backdrop-filter: blur(10px);
    }

    .zoom-ctrl-btn {
      padding: 7px 14px;
      border-radius: 99px;
      border: none;
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .zoom-ctrl-btn:active { background: rgba(255, 255, 255, 0.3); }

    /* গোপন অ্যাডমিন মডাল */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 8, 16, 0.76);
      backdrop-filter: blur(7px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow-y: auto;
    }

    .modal-overlay.active { display: flex; }

    .admin-card {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 500px;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.38);
      max-height: 92vh;
      overflow-y: auto;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .admin-header h2 { font-size: 1.15rem; font-weight: 700; }

    .close-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-main);
    }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .form-group small {
      display: block;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-top: 4px;
      line-height: 1.4;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface-2);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 11px;
      font-size: 0.94rem;
      font-family: inherit;
      outline: none;
    }

    .form-control:focus { border-color: var(--accent); }
    textarea.form-control { min-height: 84px; resize: vertical; }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 13px;
      border: none;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-save { background: var(--btn-primary); color: var(--btn-primary-text); }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text-main);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }

    .toast {
      position: fixed;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-main);
      color: var(--surface);
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 0.86rem;
      font-weight: 600;
      z-index: 200;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      display: none;
    }
  </style>
</head>
<body>

  <div class="scroll-progress" id="scrollProgress"></div>

  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
  </div>

  <!-- ফ্লোটিং গ্লাস হেডার -->
  <div class="header-wrap">
    <header class="top-bar">
      <div class="brand-left">
        <span class="brand-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
        </span>
        <div class="brand-info">
          <div class="brand-name" id="displayRestaurantName">ডিজিটাল মেনু</div>
          <div class="brand-sub"><span class="pulse-dot"></span> সরাসরি মেনু দেখুন</div>
        </div>
      </div>

      <div class="header-controls">
        <button type="button" class="icon-pill-btn" id="shareMenuBtn" title="মেনু শেয়ার করুন" aria-label="মেনু শেয়ার করুন">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>

  <div class="toast" id="toastMsg"></div>

  <script>
    (function () {
      // আপনার Google Apps Script URL সরাসরি যুক্ত করা হয়েছে
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCInMJoqXu6I5uIIki4mKrD4MInvBmM3km85MtXOUZw56gMCVjy3o8etswFzHae6G15Q/exec";

      const CACHE_KEY = "restaurant_menu_cache_v5";
      const THEME_KEY = "restaurant_theme_mode_v2";

      let sessionKey = "";
      let sessionPassword = "";
      let zoomScale = 1;

      let currentConfig = {
        restaurantName: "আমার রেস্টুরেন্ট",
        menuLinks: "",
        downloadLink: "",
        phone: "+919876543210",
        whatsapp: "919876543210"
      };

      const displayRestaurantName = document.getElementById("displayRestaurantName");
      const menuContainer = document.getElementById("menuContainer");
      const callBtn = document.getElementById("callBtn");
      const whatsappBtn = document.getElementById("whatsappBtn");
      const shareMenuBtn = document.getElementById("shareMenuBtn");
      const scrollProgress = document.getElementById("scrollProgress");
      const scrollTopBtn = document.getElementById("scrollTopBtn");

      const themeToggleBtn = document.getElementById("themeToggleBtn");
      const themeIcon = document.getElementById("themeIcon");
      const themeLabel = document.getElementById("themeLabel");

      const zoomModal = document.getElementById("zoomModal");
      const zoomImg = document.getElementById("zoomImg");
      const zoomPercentLabel = document.getElementById("zoomPercentLabel");
      const closeZoomBtn = document.getElementById("closeZoomBtn");
      const zoomInBtn = document.getElementById("zoomInBtn");
      const zoomOutBtn = document.getElementById("zoomOutBtn");
      const zoomResetBtn = document.getElementById("zoomResetBtn");

      const adminModal = document.getElementById("adminModal");
      const closeAdminBtn = document.getElementById("closeAdminBtn");
      const loginSection = document.getElementById("loginSection");
      const adminPassInput = document.getElementById("adminPassInput");
      const loginError = document.getElementById("loginError");
      const loginBtn = document.getElementById("loginBtn");
      const adminForm = document.getElementById("adminForm");
      const saveBtn = document.getElementById("saveBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const toastMsg = document.getElementById("toastMsg");

      const inputName = document.getElementById("inputName");
      const inputMenuLinks = document.getElementById("inputMenuLinks");
      const inputDownloadLink = document.getElementById("inputDownloadLink");
      const inputPhone = document.getElementById("inputPhone");
      const inputWhatsapp = document.getElementById("inputWhatsapp");

      // ডার্ক / লাইট মোড
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
          themeIcon.textContent = "☀️";
          themeLabel.textContent = "লাইট";
        } else {
          themeIcon.textContent = "🌙";
          themeLabel.textContent = "নাইট";
        }
      }

      function initTheme() {
        let saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
        if (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          saved = "dark";
        }
        applyTheme(saved === "dark" ? "dark" : "light");
      }

      themeToggleBtn.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      });

      initTheme();

      // স্ক্রল প্রগ্রেস ও উপরে যাওয়ার বাটন
      window.addEventListener("scroll", () => {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const pct = docHeight > 0 ? Math.min(100, (scrollTop / docHeight) * 100) : 0;
        scrollProgress.style.width = pct + "%";
        scrollTopBtn.classList.toggle("visible", scrollTop > 280);
      });

      scrollTopBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.style.display = "block";
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => { toastMsg.style.display = "none"; }, 2800);
      }

      // নিরাপদ শেয়ার বাটন (অ্যাডমিন ?access= প্যারামিটার বাদ দিয়ে শুধু পাবলিক লিঙ্ক শেয়ার করবে)
      shareMenuBtn.addEventListener("click", async () => {
        const cleanUrl = window.location.origin + window.location.pathname;
        const title = currentConfig.restaurantName || "রেস্টুরেন্ট মেনু";
        if (navigator.share) {
          try {
            await navigator.share({
              title: title,
              text: `${title} - আমাদের ডিজিটাল মেনু দেখুন:`,
              url: cleanUrl
            });
            return;
          } catch (e) {}
        }
        try {
          await navigator.clipboard.writeText(cleanUrl);
          showToast("মেনু লিঙ্ক কপি হয়েছে!");
        } catch (e) {
          prompt("লিঙ্কটি কপি করুন:", cleanUrl);
        }
      });

      function getDemoSvgDataUri(name) {
        const safeName = (name || "আমার রেস্টুরেন্ট").replace(/[<>&"']/g, "");
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
          <rect width="800" height="900" fill="#fffdf8"/>
          <rect x="24" y="24" width="752" height="852" rx="18" fill="none" stroke="#d97706" stroke-width="4"/>
          <text x="400" y="110" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#0f172a">${safeName}</text>
          <text x="400" y="155" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#b45309">RESTAURANT MENU</text>
          <line x1="180" y1="185" x2="620" y2="185" stroke="#d97706" stroke-width="2"/>
          <text x="70" y="260" font-family="sans-serif" font-size="22" fill="#1e293b">১. স্পেশাল ভেজ থালি</text>
          <text x="730" y="260" text-anchor="end" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1e293b">₹ ২২০</text>
          <text x="70" y="315" font-family="sans-serif" font-size="22" fill="#1e293b">২. খিচুড়ি ও কম্বো মিল</text>
          <text x="730" y="315" text-anchor="end" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1e293b">₹ ১৮০</text>
        </svg>`;
        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      }

      function getGoogleDriveId(url) {
        const m1 = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (m1) return m1[1];
        const m2 = url.match(/drive\.google\.com\/.*[?&]id=([a-zA-Z0-9_-]+)/);
        return m2 ? m2[1] : null;
      }

      function isPdfUrl(url) {
        return /\.pdf(\?.*)?$/i.test(url);
      }

      function formatPhoneForTel(phone) {
        return (phone || "").replace(/[^\d+]/g, "");
      }

      function formatWhatsappNumber(num) {
        let digits = (num || "").replace(/\D/g, "");
        if (digits.length === 10) digits = "91" + digits;
        return digits;
      }

      // ইন্টারঅ্যাক্টিভ জুম কন্ট্রোল
      function updateZoomUI() {
        zoomPercentLabel.textContent = `জুম: ${Math.round(zoomScale * 100)}%`;
        if (zoomScale <= 1) {
          zoomImg.style.width = "100%";
          zoomImg.style.maxWidth = "760px";
        } else {
          zoomImg.style.maxWidth = "none";
          zoomImg.style.width = Math.round(zoomScale * 100) + "%";
        }
      }

      function openZoomView(src) {
        zoomScale = 1;
        zoomImg.src = src;
        updateZoomUI();
        zoomModal.classList.add("active");
      }

      zoomInBtn.addEventListener("click", () => {
        zoomScale = Math.min(3, +(zoomScale + 0.4).toFixed(2));
        updateZoomUI();
      });

      zoomOutBtn.addEventListener("click", () => {
        zoomScale = Math.max(1, +(zoomScale - 0.4).toFixed(2));
        updateZoomUI();
      });

      zoomResetBtn.addEventListener("click", () => {
        zoomScale = 1;
        updateZoomUI();
      });

      closeZoomBtn.addEventListener("click", () => zoomModal.classList.remove("active"));
      zoomModal.addEventListener("click", (e) => {
        if (e.target === zoomModal) zoomModal.classList.remove("active");
      });

      async function handleDownload(targetLink) {
        const rawLinks = (currentConfig.menuLinks || "").split(/\n|,/).map(s => s.trim()).filter(Boolean);
        const target = (currentConfig.downloadLink || "").trim() || targetLink || rawLinks[0] || "";

        if (!target) {
          const a = document.createElement("a");
          a.href = getDemoSvgDataUri(currentConfig.restaurantName);
          a.download = "restaurant-menu.svg";
          document.body.appendChild(a);
          a.click();
          a.remove();
          return;
        }

        const driveId = getGoogleDriveId(target);
        if (driveId) {
          window.open(`https://drive.google.com/uc?export=download&id=${driveId}`, "_blank", "noopener");
          return;
        }

        try {
          showToast("ডাউনলোড শুরু হচ্ছে...");
          const res = await fetch(target, { mode: "cors" });
          if (!res.ok) throw new Error("Fetch failed");
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = isPdfUrl(target) ? "menu.pdf" : "menu.jpg";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        } catch (e) {
          window.open(target, "_blank", "noopener");
        }
      }

      function createActionBar(zoomSrc, downloadTarget) {
        const bar = document.createElement("div");
        bar.className = "card-action-bar";

        const zoomBtn = document.createElement("button");
        zoomBtn.type = "button";
        zoomBtn.className = "btn-zoom-inline";
        zoomBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg> জুম ভিউ`;
        if (zoomSrc) {
          zoomBtn.addEventListener("click", () => openZoomView(zoomSrc));
        } else {
          zoomBtn.style.display = "none";
        }

        const dlBtn = document.createElement("button");
        dlBtn.type = "button";
        dlBtn.className = "btn-download";
        dlBtn.innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> মেনু ডাউনলোড`;
        dlBtn.addEventListener("click", () => handleDownload(downloadTarget));

        bar.appendChild(zoomBtn);
        bar.appendChild(dlBtn);
        return bar;
      }

      function renderUserPanel() {
        document.title = (currentConfig.restaurantName || "রেস্টুরেন্ট") + " - মেনু";
        displayRestaurantName.textContent = currentConfig.restaurantName || "আমার রেস্টুরেন্ট";

        const telClean = formatPhoneForTel(currentConfig.phone);
        callBtn.href = telClean ? `tel:${telClean}` : "#";

        const waClean = formatWhatsappNumber(currentConfig.whatsapp);
        const waText = encodeURIComponent("নমস্কার! আমি আপনাদের মেনু দেখে খাবার অর্ডার করতে চাই।");
        whatsappBtn.href = waClean ? `https://wa.me/${waClean}?text=${waText}` : "#";

        menuContainer.innerHTML = "";
        const rawLinks = (currentConfig.menuLinks || "")
          .split(/\n|,/)
          .map(s => s.trim())
          .filter(Boolean);

        if (rawLinks.length === 0) {
          const frame = document.createElement("div");
          frame.className = "menu-frame";
          const card = document.createElement("div");
          card.className = "menu-card";
          const media = document.createElement("div");
          media.className = "menu-card-media";
          const demoSrc = getDemoSvgDataUri(currentConfig.restaurantName);
          const img = document.createElement("img");
          img.src = demoSrc;
          img.alt = "রেস্টুরেন্ট মেনু";
          img.addEventListener("click", () => openZoomView(demoSrc));
          media.appendChild(img);
          card.appendChild(media);
          card.appendChild(createActionBar(demoSrc, ""));
          frame.appendChild(card);
          menuContainer.appendChild(frame);
          return;
        }

        rawLinks.forEach((link, idx) => {
          const frame = document.createElement("div");
          frame.className = "menu-frame";

          const card = document.createElement("div");
          card.className = "menu-card";

          const media = document.createElement("div");
          media.className = "menu-card-media";

          if (rawLinks.length > 1) {
            const badge = document.createElement("span");
            badge.className = "page-badge";
            badge.textContent = `পাতা ${idx + 1} / ${rawLinks.length}`;
            media.appendChild(badge);
          }

          const driveId = getGoogleDriveId(link);

          if (driveId) {
            const driveThumbUrl = `https://drive.google.com/thumbnail?id=${driveId}&sz=w1600`;
            const img = document.createElement("img");
            img.src = driveThumbUrl;
            img.alt = `মেনু পেজ ${idx + 1}`;
            img.loading = "lazy";
            img.addEventListener("click", () => openZoomView(driveThumbUrl));
            img.onerror = function () {
              media.innerHTML = "";
              const iframe = document.createElement("iframe");
              iframe.src = `https://drive.google.com/file/d/${driveId}/preview`;
              iframe.title = `মেনু পেজ ${idx + 1}`;
              media.appendChild(iframe);
            };
            media.appendChild(img);
            card.appendChild(media);
            card.appendChild(createActionBar(driveThumbUrl, link));
          } else if (isPdfUrl(link)) {
            const iframe = document.createElement("iframe");
            iframe.src = `https://docs.google.com/gview?embedded=true&url=${encodeURIComponent(link)}`;
            iframe.title = `মেনু PDF ${idx + 1}`;
            media.appendChild(iframe);
            card.appendChild(media);
            card.appendChild(createActionBar(null, link));
          } else {
            const img = document.createElement("img");
            img.src = link;
            img.alt = `মেনু পেজ ${idx + 1}`;
            img.loading = "lazy";
            img.addEventListener("click", () => openZoomView(link));
            img.onerror = function () {
              media.innerHTML = `<div class="menu-error">মেনু লোড করা যায়নি।<br><a href="${link}" target="_blank" rel="noopener">মেনু ওপেন করুন</a></div>`;
            };
            media.appendChild(img);
            card.appendChild(media);
            card.appendChild(createActionBar(link, link));
          }

          frame.appendChild(card);
          menuContainer.appendChild(frame);
        });
      }

      async function loadMenuFromServer() {
        let hasCache = false;
        try {
          const cached = localStorage.getItem(CACHE_KEY);
          if (cached) {
            currentConfig = { ...currentConfig, ...JSON.parse(cached) };
            renderUserPanel();
            hasCache = true;
          }
        } catch (e) {}

        try {
          const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
          const json = await res.json();
          if (json.ok && json.data) {
            currentConfig = { ...currentConfig, ...json.data };
            localStorage.setItem(CACHE_KEY, JSON.stringify(currentConfig));
            renderUserPanel();
          }
        } catch (err) {
          if (!hasCache) renderUserPanel();
        }
      }

      async function checkSecretAdminAccess() {
        const urlKey = new URLSearchParams(window.location.search).get("access");
        if (!urlKey) return;

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "check_key", key: urlKey })
          });
          const json = await res.json();

          if (json.ok) {
            sessionKey = urlKey;
            loginSection.style.display = "block";
            adminForm.style.display = "none";
            adminModal.classList.add("active");
            setTimeout(() => adminPassInput.focus(), 100);
          }
        } catch (e) {}
      }

      function fillForm() {
        inputName.value = currentConfig.restaurantName || "";
        inputMenuLinks.value = currentConfig.menuLinks || "";
        inputDownloadLink.value = currentConfig.downloadLink || "";
        inputPhone.value = currentConfig.phone || "";
        inputWhatsapp.value = currentConfig.whatsapp || "";
      }

      closeAdminBtn.addEventListener("click", () => adminModal.classList.remove("active"));
      adminModal.addEventListener("click", (e) => {
        if (e.target === adminModal) adminModal.classList.remove("active");
      });

      async function verifyLogin() {
        const pwd = adminPassInput.value;
        if (!pwd) return;

        loginBtn.disabled = true;
        loginBtn.textContent = "যাচাই করা হচ্ছে...";
        loginError.style.display = "none";

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "verify", key: sessionKey, password: pwd })
          });
          const json = await res.json();
          if (json.ok) {
            sessionPassword = pwd;
            loginSection.style.display = "none";
            adminForm.style.display = "block";
            fillForm();
          } else {
            loginError.textContent = json.error || "ভুল পাসওয়ার্ড!";
            loginError.style.display = "block";
          }
        } catch (err) {
          loginError.textContent = "সার্ভারের সাথে সংযোগ করা যায়নি!";
          loginError.style.display = "block";
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "লগইন করুন";
        }
      }

      loginBtn.addEventListener("click", verifyLogin);
      adminPassInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); verifyLogin(); }
      });

      adminForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        saveBtn.disabled = true;
        saveBtn.textContent = "সেভ হচ্ছে...";

        const payload = {
          action: "save",
          key: sessionKey,
          password: sessionPassword,
          restaurantName: inputName.value.trim(),
          menuLinks: inputMenuLinks.value.trim(),
          downloadLink: inputDownloadLink.value.trim(),
          phone: inputPhone.value.trim(),
          whatsapp: inputWhatsapp.value.trim()
        };

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.ok && json.data) {
            currentConfig = json.data;
            localStorage.setItem(CACHE_KEY, JSON.stringify(currentConfig));
            renderUserPanel();
            adminModal.classList.remove("active");
            showToast("সফলভাবে লাইভ আপডেট হয়েছে!");
          } else {
            alert(json.error || "সেভ করা যায়নি!");
          }
        } catch (err) {
          alert("নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।");
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "✅ লাইভ সেভ করুন";
        }
      });

      logoutBtn.addEventListener("click", () => {
        sessionPassword = "";
        adminModal.classList.remove("active");
        showToast("লগআউট হয়েছে।");
      });

      loadMenuFromServer();
      checkSecretAdminAccess();
    })();
  </script>
</body>
</html>
