<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>রেস্টুরেন্ট মেনু</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* লাইট মোড — রয়্যাল স্যাফায়ার ও আইস-হোয়াইট অ্যাপ থিম */
    :root,
    [data-theme="light"] {
      --bg: #eef2f9;
      --hero-bg: linear-gradient(145deg, #172554 0%, #1d4ed8 55%, #2563eb 100%);
      --hero-text: #ffffff;
      --hero-sub: rgba(255, 255, 255, 0.82);
      --sheet-bg: #ffffff;
      --sheet-alt: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #1d4ed8;
      --sheet-shadow: 0 20px 45px -12px rgba(23, 37, 84, 0.18);
      --dock-bg: rgba(255, 255, 255, 0.85);
      --call-pill-bg: #ffffff;
      --call-pill-text: #0f172a;
      --call-pill-border: #cbd5e1;
      --dl-bg: linear-gradient(135deg, #172554, #1e40af);
      --dl-text: #ffffff;
    }

    /* ডার্ক / নাইট মোড — মিডনাইট ওনিক্স ও গোল্ড থিম */
    [data-theme="dark"] {
      --bg: #070a12;
      --hero-bg: linear-gradient(145deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
      --hero-text: #f8fafc;
      --hero-sub: rgba(253, 230, 138, 0.85);
      --sheet-bg: #111827;
      --sheet-alt: #1a2233;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1f2937;
      --accent: #fbbf24;
      --sheet-shadow: 0 24px 55px -12px rgba(0, 0, 0, 0.75);
      --dock-bg: rgba(15, 23, 42, 0.85);
      --call-pill-bg: #1e293b;
      --call-pill-text: #f8fafc;
      --call-pill-border: #334155;
      --dl-bg: linear-gradient(135deg, #f59e0b, #d97706);
      --dl-text: #090d16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 100px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* কার্ভড হিরো ব্যানার */
    .hero-banner {
      background: var(--hero-bg);
      color: var(--hero-text);
      padding: 14px 16px 56px;
      border-radius: 0 0 34px 34px;
      box-shadow: 0 12px 32px rgba(23, 37, 84, 0.22);
      position: relative;
      overflow: hidden;
    }

    .hero-banner::after {
      content: "";
      position: absolute;
      right: -50px;
      top: -50px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .hero-top-row {
      max-width: 760px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 0.76rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }

    .hero-tag-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
    }

    .hero-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .glass-btn {
      height: 35px;
      padding: 0 11px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .glass-btn.icon-only {
      width: 35px;
      padding: 0;
      justify-content: center;
    }

    .glass-btn:active { transform: scale(0.94); }

    .hero-title-box {
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .brand-name {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .brand-tagline {
      margin-top: 2px;
      font-size: 0.84rem;
      color: var(--hero-sub);
      font-weight: 500;
    }

    /* ওভারল্যাপিং মেনু শিট */
    .main-container {
      max-width: 760px;
      margin: -34px auto 0;
      padding: 0 12px;
      position: relative;
      z-index: 10;
    }

    .menu-sheet {
      background: var(--sheet-bg);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--sheet-shadow);
      overflow: hidden;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* শিটের উপরের টুলবার */
    .sheet-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: var(--sheet-alt);
      border-bottom: 1px solid var(--border);
    }

    .sheet-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sheet-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-tool-btn {
      padding: 6px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--sheet-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .mini-tool-btn:active { transform: scale(0.95); }

    .menu-pages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px;
    }

    .menu-page-item {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #ffffff;
    }

    .menu-page-item img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      cursor: zoom-in;
    }

    .menu-page-item iframe {
      display: block;
      width: 100%;
      height: 73vh;
      min-height: 450px;
      border: none;
    }

    .page-tag {
      background: var(--sheet-alt);
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      text-align: center;
      padding: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* শিমার লোডার */
    .skeleton-box {
      height: 420px;
      border-radius: 16px;
      background: linear-gradient(90deg, var(--sheet-alt) 25%, var(--sheet-bg) 50%, var(--sheet-alt) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite linear;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-weight: 600;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .menu-error {
      padding: 36px 18px;
      text-align: center;
      color: var(--muted);
    }

    .menu-error a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
    }

    /* শিটের নিচে ডাউনলোড বাটন */
    .sheet-footer {
      padding: 4px 12px 14px;
    }

    .btn-download-full {
      width: 100%;
      padding: 13px 18px;
      border-radius: 15px;
      border: none;
      background: var(--dl-bg);
      color: var(--dl-text);
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 8px 22px -6px rgba(29, 78, 216, 0.4);
    }

    .btn-download-full:active { transform: scale(0.98); }

    /* নিচের ফ্লোটিং আইকন-ব্যাজ পিল ডক */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 60;
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, transparent 0%, var(--bg) 35%);
      pointer-events: none;
    }

    .dock-inner {
      pointer-events: auto;
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    .pill-action {
      flex: 1;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px 8px 8px;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.16);
      transition: transform 0.15s ease;
    }

    .pill-action:active { transform: scale(0.96); }

    .pill-icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pill-call {
      background: var(--call-pill-bg);
      color: var(--call-pill-text);
      border: 1px solid var(--call-pill-border);
    }

    .pill-call .pill-icon-circle {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
    }

    .pill-whatsapp {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #ffffff;
    }

    .pill-whatsapp .pill-icon-circle {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .pill-text-wrap {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .pill-sub {
      font-size: 0.68rem;
      font-weight: 500;
      opacity: 0.78;
    }

    /* জুম মডাল */
    .zoom-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(7, 10, 18, 0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
    }

    .zoom-overlay.active { display: flex; }

    .zoom-topbar {
      width: 100%;
      max-width: 760px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      padding-bottom: 8px;
    }

    .zoom-label { font-size: 0.88rem; font-weight: 600; opacity: 0.85; }

    .zoom-close {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .zoom-scroll {
      flex: 1;
      width: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .zoom-scroll img {
      width: 100%;
      max-width: 740px;
      height: auto;
      border-radius: 10px;
      transition: width 0.2s ease;
    }

    .zoom-controls {
      margin-top: 10px;
      display: inline-flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      padding: 6px;
      border-radius: 99px;
    }

    .zoom-ctrl-btn {
      padding: 7px 14px;
      border-radius: 99px;
      border: none;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* অ্যাডমিন মডাল */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(7, 10, 18, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow-y: auto;
    }

    .modal-overlay.active { display: flex; }

    .admin-card {
      background: var(--sheet-bg);
      color: var(--text);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 480px;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.4);
      max-height: 92vh;
      overflow-y: auto;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .admin-header h2 { font-size: 1.1rem; font-weight: 700; }

    .close-btn {
      background: var(--sheet-alt);
      border: 1px solid var(--border);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: var(--text);
    }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block;
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .form-group small {
      display: block;
      color: var(--muted);
      font-size: 0.77rem;
      margin-top: 4px;
      line-height: 1.4;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background: var(--sheet-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.94rem;
      font-family: inherit;
      outline: none;
    }

    .form-control:focus { border-color: var(--accent); }
    textarea.form-control { min-height: 84px; resize: vertical; }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-save { background: var(--dl-bg); color: var(--dl-text); }
    .btn-secondary {
      background: var(--sheet-alt);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.84rem;
      margin-top: 8px;
      display: none;
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      display: none;
    }
  </style>
</head>
<body>

  <!-- কার্ভড রয়্যাল হিরো ব্যানার -->
  <section class="hero-banner">
    <div class="hero-top-row">
      <span class="hero-tag">
        <span class="hero-tag-dot"></span>
        ডিজিটাল মেনু
      </span>

      <div class="hero-controls">
        <button type="button" class="glass-btn icon-only" id="shareMenuBtn" title="শেয়ার করুন" aria-label="শেয়ার করুন">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>

        <button type="button" class="glass-btn" id="themeToggleBtn" aria-label="নাইট বা ডে মোড">
          <span id="themeIcon">🌙</span>
          <span id="themeLabel">নাইট মোড</span>
        </button>
      </div>
    </div>

    <div class="hero-title-box">
      <h1 class="brand-name" id="displayRestaurantName">ডিজিটাল মেনু</h1>
      <p class="brand-tagline">ছবিতে ট্যাপ করে বড় করে দেখুন ও অর্ডার করুন</p>
    </div>
  </section>

  <!-- ওভারল্যাপিং মেনু শিট -->
  <main class="main-container">
    <div class="menu-sheet">
      <div class="sheet-toolbar">
        <span class="sheet-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          মেনু কার্ড
        </span>
        <div class="sheet-tools">
          <button type="button" class="mini-tool-btn" id="topZoomBtn" style="display: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            জুম
          </button>
          <button type="button" class="mini-tool-btn" id="topDownloadBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            সেভ
          </button>
        </div>
      </div>

      <div class="menu-pages" id="menuContainer">
        <div class="skeleton-box">মেনু লোড হচ্ছে...</div>
      </div>

      <div class="sheet-footer">
        <button type="button" class="btn-download-full" id="downloadMenuBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>মেনু ডাউনলোড করুন</span>
        </button>
      </div>
    </div>
  </main>

  <!-- নিচের ফ্লোটিং আইকন-ব্যাজ পিল ডক -->
  <footer class="bottom-dock">
    <div class="dock-inner">
      <a href="tel:+919876543210" class="pill-action pill-call" id="callBtn">
        <span class="pill-icon-circle">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </span>
        <span class="pill-text-wrap">
          <span>কল করুন</span>
          <span class="pill-sub">সরাসরি অর্ডার</span>
        </span>
      </a>

      <a href="https://wa.me/919876543210" target="_blank" rel="noopener" class="pill-action pill-whatsapp" id="whatsappBtn">
        <span class="pill-icon-circle">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.03 2C6.5 2 2 6.48 2 12c0 1.97.57 3.81 1.56 5.36L2 22l4.78-1.52A9.95 9.95 0 0 0 12.03 22C17.55 22 22 17.52 22 12S17.55 2 12.03 2zm5.82 14.12c-.25.7-1.44 1.34-2 1.42-.52.08-1.18.11-1.91-.12-.45-.14-1.03-.33-1.76-.65-3.08-1.33-5.09-4.43-5.24-4.63-.15-.21-1.25-1.66-1.25-3.17s.79-2.25 1.07-2.55c.28-.3.61-.38.82-.38.2 0 .41 0 .59.01.19.01.44-.07.69.53.26.62.87 2.13.95 2.28.08.15.13.33.03.54-.1.2-.15.33-.31.51-.15.18-.32.4-.46.54-.15.15-.31.32-.13.62.18.3.79 1.3 1.7 2.1 1.17 1.04 2.15 1.37 2.46 1.52.3.15.48.13.66-.08.18-.2.76-.88.96-1.18.2-.3.41-.25.68-.15.28.1 1.76.83 2.06.98.3.15.51.23.58.36.08.13.08.75-.17 1.45z"/>
          </svg>
        </span>
        <span class="pill-text-wrap">
          <span>WhatsApp</span>
          <span class="pill-sub">মেসেজ করুন</span>
        </span>
      </a>
    </div>
  </footer>

  <!-- জুম মডাল -->
  <div class="zoom-overlay" id="zoomModal">
    <div class="zoom-topbar">
      <span class="zoom-label" id="zoomPercentLabel">জুম: ১০০%</span>
      <button class="zoom-close" id="closeZoomBtn" aria-label="বন্ধ করুন">&times;</button>
    </div>
    <div class="zoom-scroll">
      <img id="zoomImg" src="" alt="মেনু বড় ভিউ" />
    </div>
    <div class="zoom-controls">
      <button type="button" class="zoom-ctrl-btn" id="zoomOutBtn">➖ ছোট</button>
      <button type="button" class="zoom-ctrl-btn" id="zoomResetBtn">১০০%</button>
      <button type="button" class="zoom-ctrl-btn" id="zoomInBtn">➕ বড়</button>
    </div>
  </div>

  <!-- গোপন অ্যাডমিন মডাল -->
  <div class="modal-overlay" id="adminModal">
    <div class="admin-card">
      <div class="admin-header">
        <h2>⚙️ অ্যাডমিন প্যানেল</h2>
        <button class="close-btn" id="closeAdminBtn" aria-label="বন্ধ করুন">&times;</button>
      </div>

      <div id="loginSection">
        <div class="form-group">
          <label for="adminPassInput">অ্যাডমিন পাসওয়ার্ড দিন</label>
          <input type="password" id="adminPassInput" class="form-control" placeholder="আপনার গোপন পাসওয়ার্ড..." />
          <div class="error-msg" id="loginError"></div>
        </div>
        <button type="button" class="btn btn-save" id="loginBtn">লগইন করুন</button>
      </div>

      <form id="adminForm" style="display: none;">
        <div class="form-group">
          <label for="inputName">রেস্টুরেন্টের নাম</label>
          <input type="text" id="inputName" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="inputMenuLinks">মেনু লিঙ্ক (Link Format)</label>
          <textarea id="inputMenuLinks" class="form-control" placeholder="ছবি, PDF বা Google Drive লিঙ্ক দিন..."></textarea>
          <small>একাধিক পেজ হলে প্রতিটি লিঙ্ক নতুন লাইনে দিন।</small>
        </div>

        <div class="form-group">
          <label for="inputDownloadLink">আলাদা ডাউনলোড লিঙ্ক (ঐচ্ছিক)</label>
          <input type="url" id="inputDownloadLink" class="form-control" placeholder="খালি রাখলে মেনু লিঙ্ক থেকেই ডাউনলোড হবে" />
        </div>

        <div class="form-group">
          <label for="inputPhone">কল নম্বর</label>
          <input type="tel" id="inputPhone" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="inputWhatsapp">WhatsApp নম্বর</label>
          <input type="tel" id="inputWhatsapp" class="form-control" placeholder="919876543210" required />
        </div>

        <button type="submit" class="btn btn-save" id="saveBtn">✅ লাইভ সেভ করুন</button>
        <button type="button" class="btn btn-secondary" id="logoutBtn">লগআউট করুন</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toastMsg"></div>

  <script>
    (function () {
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCInMJoqXu6I5uIIki4mKrD4MInvBmM3km85MtXOUZw56gMCVjy3o8etswFzHae6G15Q/exec";
      const CACHE_KEY = "restaurant_menu_cache_v7";
      const THEME_KEY = "restaurant_theme_mode_v4";

      let sessionKey = "";
      let sessionPassword = "";
      let zoomScale = 1;
      let primaryZoomSrc = "";

      let currentConfig = {
        restaurantName: "আমার রেস্টুরেন্ট",
        menuLinks: "",
        downloadLink: "",
        phone: "+919876543210",
        whatsapp: "919876543210"
      };

      const displayRestaurantName = document.getElementById("displayRestaurantName");
      const menuContainer = document.getElementById("menuContainer");
      const topZoomBtn = document.getElementById("topZoomBtn");
      const topDownloadBtn = document.getElementById("topDownloadBtn");
      const downloadMenuBtn = document.getElementById("downloadMenuBtn");
      const callBtn = document.getElementById("callBtn");
      const whatsappBtn = document.getElementById("whatsappBtn");
      const shareMenuBtn = document.getElementById("shareMenuBtn");

      const themeToggleBtn = document.getElementById("themeToggleBtn");
      const themeIcon = document.getElementById("themeIcon");
      const themeLabel = document.getElementById("themeLabel");

      const zoomModal = document.getElementById("zoomModal");
      const zoomImg = document.getElementById("zoomImg");
      const zoomPercentLabel = document.getElementById("zoomPercentLabel");
      const closeZoomBtn = document.getElementById("closeZoomBtn");
      const zoomInBtn = document.getElementById("zoomInBtn");
      const zoomOutBtn = document.getElementById("zoomOutBtn");
      const zoomResetBtn = document.getElementById("zoomResetBtn");

      const adminModal = document.getElementById("adminModal");
      const closeAdminBtn = document.getElementById("closeAdminBtn");
      const loginSection = document.getElementById("loginSection");
      const adminPassInput = document.getElementById("adminPassInput");
      const loginError = document.getElementById("loginError");
      const loginBtn = document.getElementById("loginBtn");
      const adminForm = document.getElementById("adminForm");
      const saveBtn = document.getElementById("saveBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const toastMsg = document.getElementById("toastMsg");

      const inputName = document.getElementById("inputName");
      const inputMenuLinks = document.getElementById("inputMenuLinks");
      const inputDownloadLink = document.getElementById("inputDownloadLink");
      const inputPhone = document.getElementById("inputPhone");
      const inputWhatsapp = document.getElementById("inputWhatsapp");

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
          themeIcon.textContent = "☀️";
          themeLabel.textContent = "ডে মোড";
        } else {
          themeIcon.textContent = "🌙";
          themeLabel.textContent = "নাইট মোড";
        }
      }

      function initTheme() {
        let saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
        if (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          saved = "dark";
        }
        applyTheme(saved === "dark" ? "dark" : "light");
      }

      themeToggleBtn.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      });

      initTheme();

      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.style.display = "block";
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => { toastMsg.style.display = "none"; }, 2800);
      }

      shareMenuBtn.addEventListener("click", async () => {
        const cleanUrl = window.location.origin + window.location.pathname;
        const title = currentConfig.restaurantName || "রেস্টুরেন্ট মেনু";
        if (navigator.share) {
          try {
            await navigator.share({
              title: title,
              text: `${title} - আমাদের মেনু দেখুন:`,
              url: cleanUrl
            });
            return;
          } catch (e) {}
        }
        try {
          await navigator.clipboard.writeText(cleanUrl);
          showToast("মেনু লিঙ্ক কপি হয়েছে!");
        } catch (e) {
          prompt("লিঙ্কটি কপি করুন:", cleanUrl);
        }
      });

      function getDemoSvgDataUri(name) {
        const safeName = (name || "আমার রেস্টুরেন্ট").replace(/[<>&"']/g, "");
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
          <rect width="800" height="900" fill="#fffdf8"/>
          <rect x="24" y="24" width="752" height="852" rx="18" fill="none" stroke="#1d4ed8" stroke-width="4"/>
          <text x="400" y="110" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#172554">${safeName}</text>
          <text x="400" y="155" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#2563eb">RESTAURANT MENU</text>
          <line x1="180" y1="185" x2="620" y2="185" stroke="#1d4ed8" stroke-width="2"/>
          <text x="70" y="260" font-family="sans-serif" font-size="22" fill="#0f172a">১. স্পেশাল ভেজ থালি</text>
          <text x="730" y="260" text-anchor="end" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0f172a">₹ ২২০</text>
          <text x="70" y="315" font-family="sans-serif" font-size="22" fill="#0f172a">২. খিচুড়ি ও কম্বো মিল</text>
          <text x="730" y="315" text-anchor="end" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0f172a">₹ ১৮০</text>
        </svg>`;
        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      }

      function getGoogleDriveId(url) {
        const m1 = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (m1) return m1[1];
        const m2 = url.match(/drive\.google\.com\/.*[?&]id=([a-zA-Z0-9_-]+)/);
        return m2 ? m2[1] : null;
      }

      function isPdfUrl(url) {
        return /\.pdf(\?.*)?$/i.test(url);
      }

      function formatPhoneForTel(phone) {
        return (phone || "").replace(/[^\d+]/g, "");
      }

      function formatWhatsappNumber(num) {
        let digits = (num || "").replace(/\D/g, "");
        if (digits.length === 10) digits = "91" + digits;
        return digits;
      }

      function updateZoomUI() {
        zoomPercentLabel.textContent = `জুম: ${Math.round(zoomScale * 100)}%`;
        if (zoomScale <= 1) {
          zoomImg.style.width = "100%";
          zoomImg.style.maxWidth = "740px";
        } else {
          zoomImg.style.maxWidth = "none";
          zoomImg.style.width = Math.round(zoomScale * 100) + "%";
        }
      }

      function openZoomView(src) {
        if (!src) return;
        zoomScale = 1;
        zoomImg.src = src;
        updateZoomUI();
        zoomModal.classList.add("active");
      }

      topZoomBtn.addEventListener("click", () => openZoomView(primaryZoomSrc));
      zoomInBtn.addEventListener("click", () => { zoomScale = Math.min(3, +(zoomScale + 0.4).toFixed(2)); updateZoomUI(); });
      zoomOutBtn.addEventListener("click", () => { zoomScale = Math.max(1, +(zoomScale - 0.4).toFixed(2)); updateZoomUI(); });
      zoomResetBtn.addEventListener("click", () => { zoomScale = 1; updateZoomUI(); });
      closeZoomBtn.addEventListener("click", () => zoomModal.classList.remove("active"));
      zoomModal.addEventListener("click", (e) => { if (e.target === zoomModal) zoomModal.classList.remove("active"); });

      async function downloadMenuAction() {
        const rawLinks = (currentConfig.menuLinks || "").split(/\n|,/).map(s => s.trim()).filter(Boolean);
        const target = (currentConfig.downloadLink || "").trim() || rawLinks[0] || "";

        if (!target) {
          const a = document.createElement("a");
          a.href = getDemoSvgDataUri(currentConfig.restaurantName);
          a.download = "restaurant-menu.svg";
          document.body.appendChild(a);
          a.click();
          a.remove();
          return;
        }

        const driveId = getGoogleDriveId(target);
        if (driveId) {
          window.open(`https://drive.google.com/uc?export=download&id=${driveId}`, "_blank", "noopener");
          return;
        }

        try {
          showToast("ডাউনলোড শুরু হচ্ছে...");
          const res = await fetch(target, { mode: "cors" });
          if (!res.ok) throw new Error("Fetch failed");
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = isPdfUrl(target) ? "menu.pdf" : "menu.jpg";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        } catch (e) {
          window.open(target, "_blank", "noopener");
        }
      }

      downloadMenuBtn.addEventListener("click", downloadMenuAction);
      topDownloadBtn.addEventListener("click", downloadMenuAction);

      function renderUserPanel() {
        document.title = (currentConfig.restaurantName || "রেস্টুরেন্ট") + " - মেনু";
        displayRestaurantName.textContent = currentConfig.restaurantName || "আমার রেস্টুরেন্ট";

        const telClean = formatPhoneForTel(currentConfig.phone);
        callBtn.href = telClean ? `tel:${telClean}` : "#";

        const waClean = formatWhatsappNumber(currentConfig.whatsapp);
        const waText = encodeURIComponent("নমস্কার! আমি আপনাদের মেনু দেখে খাবার অর্ডার করতে চাই।");
        whatsappBtn.href = waClean ? `https://wa.me/${waClean}?text=${waText}` : "#";

        menuContainer.innerHTML = "";
        primaryZoomSrc = "";
        topZoomBtn.style.display = "none";

        const rawLinks = (currentConfig.menuLinks || "")
          .split(/\n|,/)
          .map(s => s.trim())
          .filter(Boolean);

        if (rawLinks.length === 0) {
          const item = document.createElement("div");
          item.className = "menu-page-item";
          const demoSrc = getDemoSvgDataUri(currentConfig.restaurantName);
          const img = document.createElement("img");
          img.src = demoSrc;
          img.alt = "রেস্টুরেন্ট মেনু";
          img.addEventListener("click", () => openZoomView(demoSrc));
          item.appendChild(img);
          menuContainer.appendChild(item);
          primaryZoomSrc = demoSrc;
          topZoomBtn.style.display = "inline-flex";
          return;
        }

        rawLinks.forEach((link, idx) => {
          const item = document.createElement("div");
          item.className = "menu-page-item";

          if (rawLinks.length > 1) {
            const tag = document.createElement("div");
            tag.className = "page-tag";
            tag.textContent = `পাতা ${idx + 1} / ${rawLinks.length}`;
            item.appendChild(tag);
          }

          const driveId = getGoogleDriveId(link);

          if (driveId) {
            const driveThumbUrl = `https://drive.google.com/thumbnail?id=${driveId}&sz=w1600`;
            if (!primaryZoomSrc) {
              primaryZoomSrc = driveThumbUrl;
              topZoomBtn.style.display = "inline-flex";
            }
            const img = document.createElement("img");
            img.src = driveThumbUrl;
            img.alt = `মেনু পেজ ${idx + 1}`;
            img.loading = "lazy";
            img.addEventListener("click", () => openZoomView(driveThumbUrl));
            img.onerror = function () {
              item.innerHTML = "";
              const iframe = document.createElement("iframe");
              iframe.src = `https://drive.google.com/file/d/${driveId}/preview`;
              iframe.title = `মেনু পেজ ${idx + 1}`;
              item.appendChild(iframe);
            };
            item.appendChild(img);
          } else if (isPdfUrl(link)) {
            const iframe = document.createElement("iframe");
            iframe.src = `https://docs.google.com/gview?embedded=true&url=${encodeURIComponent(link)}`;
            iframe.title = `মেনু PDF ${idx + 1}`;
            item.appendChild(iframe);
          } else {
            if (!primaryZoomSrc) {
              primaryZoomSrc = link;
              topZoomBtn.style.display = "inline-flex";
            }
            const img = document.createElement("img");
            img.src = link;
            img.alt = `মেনু পেজ ${idx + 1}`;
            img.loading = "lazy";
            img.addEventListener("click", () => openZoomView(link));
            img.onerror = function () {
              item.innerHTML = `<div class="menu-error">মেনু লোড করা যায়নি।<br><a href="${link}" target="_blank" rel="noopener">মেনু ওপেন করুন</a></div>`;
            };
            item.appendChild(img);
          }

          menuContainer.appendChild(item);
        });
      }

      async function loadMenuFromServer() {
        let hasCache = false;
        try {
          const cached = localStorage.getItem(CACHE_KEY);
          if (cached) {
            currentConfig = { ...currentConfig, ...JSON.parse(cached) };
            renderUserPanel();
            hasCache = true;
          }
        } catch (e) {}

        try {
          const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
          const json = await res.json();
          if (json.ok && json.data) {
            currentConfig = { ...currentConfig, ...json.data };
            localStorage.setItem(CACHE_KEY, JSON.stringify(currentConfig));
            renderUserPanel();
          }
        } catch (err) {
          if (!hasCache) renderUserPanel();
        }
      }

      async function checkSecretAdminAccess() {
        const urlKey = new URLSearchParams(window.location.search).get("access");
        if (!urlKey) return;

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "check_key", key: urlKey })
          });
          const json = await res.json();

          if (json.ok) {
            sessionKey = urlKey;
            loginSection.style.display = "block";
            adminForm.style.display = "none";
            adminModal.classList.add("active");
            setTimeout(() => adminPassInput.focus(), 100);
          }
        } catch (e) {}
      }

      function fillForm() {
        inputName.value = currentConfig.restaurantName || "";
        inputMenuLinks.value = currentConfig.menuLinks || "";
        inputDownloadLink.value = currentConfig.downloadLink || "";
        inputPhone.value = currentConfig.phone || "";
        inputWhatsapp.value = currentConfig.whatsapp || "";
      }

      closeAdminBtn.addEventListener("click", () => adminModal.classList.remove("active"));
      adminModal.addEventListener("click", (e) => {
        if (e.target === adminModal) adminModal.classList.remove("active");
      });

      async function verifyLogin() {
        const pwd = adminPassInput.value;
        if (!pwd) return;

        loginBtn.disabled = true;
        loginBtn.textContent = "যাচাই করা হচ্ছে...";
        loginError.style.display = "none";

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "verify", key: sessionKey, password: pwd })
          });
          const json = await res.json();
          if (json.ok) {
            sessionPassword = pwd;
            loginSection.style.display = "none";
            adminForm.style.display = "block";
            fillForm();
          } else {
            loginError.textContent = json.error || "ভুল পাসওয়ার্ড!";
            loginError.style.display = "block";
          }
        } catch (err) {
          loginError.textContent = "সার্ভারের সাথে সংযোগ করা যায়নি!";
          loginError.style.display = "block";
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "লগইন করুন";
        }
      }

      loginBtn.addEventListener("click", verifyLogin);
      adminPassInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); verifyLogin(); }
      });

      adminForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        saveBtn.disabled = true;
        saveBtn.textContent = "সেভ হচ্ছে...";

        const payload = {
          action: "save",
          key: sessionKey,
          password: sessionPassword,
          restaurantName: inputName.value.trim(),
          menuLinks: inputMenuLinks.value.trim(),
          downloadLink: inputDownloadLink.value.trim(),
          phone: inputPhone.value.trim(),
          whatsapp: inputWhatsapp.value.trim()
        };

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.ok && json.data) {
            currentConfig = json.data;
            localStorage.setItem(CACHE_KEY, JSON.stringify(currentConfig));
            renderUserPanel();
            adminModal.classList.remove("active");
            showToast("সফলভাবে লাইভ আপডেট হয়েছে!");
          } else {
            alert(json.error || "সেভ করা যায়নি!");
          }
        } catch (err) {
          alert("নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।");
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "✅ লাইভ সেভ করুন";
        }
      });

      logoutBtn.addEventListener("click", () => {
        sessionPassword = "";
        adminModal.classList.remove("active");
        showToast("লগআউট হয়েছে।");
      });

      loadMenuFromServer();
      checkSecretAdminAccess();
    })();
  </script>
</body>
</html>
